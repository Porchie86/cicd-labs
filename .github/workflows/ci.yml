name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --output-format=github

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: |
          mkdir -p reports
          pytest -m "unit or api" -n auto --cov --cov-report=xml --cov-report=html --cov-fail-under=85 --junitxml=reports/junit.xml
      - name: Résumé de couverture dans le job
        if: always()
        run: coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
      - name: Publier les rapports de tests et couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            reports/
            htmlcov/

  test-container:
    needs: lint
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: pytest -m "unit or api" -n auto

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t minishop:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name minishop-test -p 8000:8000 minishop:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo ""
              docker rm -f minishop-test
              exit 0
            fi
            sleep 1
          done
          docker logs minishop-test
          docker rm -f minishop-test
          exit 1
